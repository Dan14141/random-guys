services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: randomguys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  web:
    build: .
    environment:
      DEBUG: "False"
      SECRET_KEY: "change-me-in-production"
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: randomguys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      INITIAL_LOAD_COUNT: "1000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
